<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : l'application peut dessiner sous l'encoche et la
         barre de gestes, à charge pour elle de respecter les safe-area. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Couleur de la barre système, accordée à l'en-tête dans les deux modes.
         L'ordre compte : un navigateur qui ignore `media` retient la dernière
         balise qu'il comprend, donc le mode clair doit fermer la marche. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d2f28" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0b6553" />
    <meta name="theme-color" content="#0b6553" />
    <meta name="description" content="Minka — la maison, en un seul endroit." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Ouverture en plein écran depuis l'écran d'accueil. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Minka" />

    <title>Minka</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
