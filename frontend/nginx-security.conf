# En-têtes de sécurité des fichiers servis par nginx.
#
# Ce fragment est inclus dans CHAQUE bloc `location` qui utilise `add_header`.
# C'est une contrainte de nginx et non une maladresse : dès qu'un `location`
# déclare son propre `add_header`, il perd tous ceux hérités du bloc parent.
# Les centraliser ici évite d'avoir à les recopier — et de les oublier.
#
# Strict-Transport-Security est absent volontairement : Nginx Proxy Manager le
# pose déjà via l'option « Force SSL », et un en-tête en double n'apporte rien.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;

# L'application ne charge que ses propres ressources et ne parle qu'à sa propre
# API. `unsafe-inline` reste nécessaire pour les styles : React applique des
# attributs `style` en ligne (hauteurs animées, marges liées aux encoches).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
