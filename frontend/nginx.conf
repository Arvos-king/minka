# Minka — nginx du conteneur frontend.
#
# Ce nginx n'est PAS ton reverse proxy : il vit à l'intérieur du stack, derrière
# Nginx Proxy Manager. Il a deux rôles :
#   1. servir la SPA compilée par Vite ;
#   2. relayer /api/ vers le conteneur minka-api, qui n'est pas exposé.
#
# La chaîne complète est donc :
#   navigateur → NPM (HTTPS) → IP_UNRAID:8070 → ce nginx → minka-api:3000

# Conserve l'information de protocole transmise par NPM. Le réflexe habituel
# (`proxy_set_header X-Forwarded-Proto $scheme`) annoncerait « http » à l'API,
# puisque le TLS est terminé un cran plus haut : la valeur d'origine est donc
# reprise telle quelle, et $scheme ne sert que de repli en accès direct.
map $http_x_forwarded_proto $minka_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Même principe pour l'hôte, que l'API compare, port compris, à l'en-tête Origin
# des requêtes mutantes. D'où le repli sur $http_host — l'en-tête Host tel que
# le navigateur l'a envoyé — et non sur $host, qui ampute le port : par
# http://IP_UNRAID:8070, l'origine « IP_UNRAID:8070 » ne correspondait pas à
# l'hôte « IP_UNRAID », et la connexion était refusée (403 BAD_ORIGIN).
# Derrière NPM, rien ne change : l'adresse publique, en HTTPS sur le port
# standard, n'a pas de port à perdre.
map $http_x_forwarded_host $minka_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Volontairement pas de `set_real_ip_from` ici : ce module réécrirait
    # $remote_addr, donc aussi $proxy_add_x_forwarded_for, et l'API compterait
    # deux fois la même adresse dans la chaîne. On laisse simplement nginx
    # ajouter son maillon, et Express remonte la chaîne avec TRUST_PROXY=2.

    location /api/ {
        proxy_pass http://minka-api:3000;
        proxy_http_version 1.1;

        # Host tel que reçu, port compris, comme $minka_host. L'API ne le
        # consulte que si elle ne fait pas confiance à ce nginx (TRUST_PROXY
        # à 0) : il doit alors dire la même chose que X-Forwarded-Host.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        # `$proxy_add_x_forwarded_for` complète la chaîne existante au lieu de
        # l'écraser : l'adresse du visiteur transmise par NPM est préservée.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $minka_proto;
        proxy_set_header X-Forwarded-Host  $minka_host;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;

        # Le jour où un module aura besoin de temps réel (SSE ou WebSocket),
        # ajouter ici : proxy_set_header Upgrade / Connection et
        # `proxy_buffering off;`.
    }

    # SPA : toute route inconnue retombe sur index.html, sinon un rechargement
    # direct sur une route React Router renverrait 404.
    location / {
        include /etc/nginx/snippets/minka-security.conf;
        try_files $uri $uri/ /index.html;
    }

    # Assets fingerprintés par Vite (le hash figure dans le nom) : cache
    # immuable, ils ne changent jamais sans changer de nom.
    location /assets/ {
        include /etc/nginx/snippets/minka-security.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Le service worker ne doit jamais être mis en cache : c'est lui qui pilote
    # la mise à jour de l'application installée. Une version périmée fige les
    # téléphones sur l'ancienne interface.
    location = /sw.js {
        include /etc/nginx/snippets/minka-security.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /index.html {
        include /etc/nginx/snippets/minka-security.conf;
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/minka-security.conf;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;
}
